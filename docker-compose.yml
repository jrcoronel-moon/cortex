services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./cortex_data:/app/data
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DB_PATH=/app/data/cortex.db

  # Continuous SQLite backup to S3. Shares the DB volume read-only-ish with web
  # (Litestream reads the live DB + WAL). Restore is a manual op — see README.
  litestream:
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./cortex_data:/app/data
      - ./litestream.yml:/etc/litestream.yml:ro
    command: replicate -config /etc/litestream.yml
    depends_on:
      - web

  website:
    build: ./landing
    restart: unless-stopped
    expose:
      - "3001"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - website

volumes:
  caddy_data:
  caddy_config:
